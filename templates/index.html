<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 물류 카트 관제 시스템 (Control Dashboard)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif; }
        body { background-color: #0f111a; color: #cdd6f4; padding: 16px; min-height: 100vh; }

        /* 2열 메인 레이아웃 (좌:우 = 1:1) */
        .main-container { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 1440px; margin: 0 auto; }
        .col { display: flex; flex-direction: column; gap: 14px; }

        .card { background-color: #181926; border: 1px solid #24273a; border-radius: 12px; padding: 14px; }
        .title { color: #5cffd1; font-size: 14px; font-weight: bold; margin-bottom: 8px; }

        /* 뷰포트 (비디오 & 3D 동일 높이 360px) */
        .viewport-box { width: 100%; height: 360px; background: #11121d; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
        .viewport-box img { width: 100%; height: 100%; object-fit: contain; }
        #canvas3d { width: 100% !important; height: 100% !important; display: block; }

        /* AI 적재물 칩 */
        .ai-chips { display: flex; gap: 8px; margin-bottom: 12px; }
        .chip { flex: 1; padding: 6px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; text-align: center; }
        .chip-red { background: #3b222e; color: #ed8796; border: 1px solid #5a2e3f; }
        .chip-green { background: #233b2e; color: #a6da95; border: 1px solid #325942; }
        .chip-yellow { background: #3d3725; color: #eed49f; border: 1px solid #5d5332; }

        /* 상태 뱃지 & DB 로그 버튼 */
        .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
        .status-badge { flex: 1; background-color: #1e3a2f; color: #a6da95; border: 1px solid #2e5e47; font-weight: bold; font-size: 12px; border-radius: 6px; padding: 6px 10px; text-align: center; }
        .status-alert { background-color: #3e1f2b; color: #ed8796; border: 1px solid #6e2d3b; }

        .btn-db-log {
            width: 100%;
            background-color: #181926;
            color: #a5adcb;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 7px 12px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .btn-db-log:hover { background-color: #1e2030; color: #ffffff; border: 1px solid #ffffff; }

        /* 텔레메트리 그리드 */
        .telemetry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
        .metric-box { background-color: #1e2030; color: #cad3f5; border: 1px solid #2b2f46; border-radius: 6px; padding: 6px 8px; font-size: 12px; }

        /* 그래프 영역 */
        .chart-box { height: 210px; position: relative; }

        /* DB 모달 (LogViewerDialog) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background-color: #181926; border: 1px solid #313244; border-radius: 12px;
            width: 90%; max-width: 900px; max-height: 85vh; display: flex; flex-direction: column; padding: 18px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-close { background: none; border: none; color: #ed8796; font-size: 20px; font-weight: bold; cursor: pointer; }
        
        .tab-buttons { display: flex; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid #2b2f46; padding-bottom: 8px; }
        .tab-btn {
            background: none; border: none; color: #a5adcb; font-size: 13px; font-weight: bold; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active { background-color: #313244; color: #5cffd1; }
        
        .tab-content { flex: 1; overflow-y: auto; }
        .db-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        .db-table th { background-color: #1e2030; color: #5cffd1; padding: 8px; border-bottom: 1px solid #313244; position: sticky; top: 0; }
        .db-table td { padding: 8px; border-bottom: 1px solid #24273a; color: #cad3f5; }
        .db-table tr:hover { background-color: #1e2030; }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- ================= 좌측 컬럼 ================= -->
        <div class="col">
            <!-- 1. 비디오 스트림 -->
            <div class="card">
                <div class="viewport-box">
                    <img src="/video_feed" alt="Connecting to ESP32-CAM..." onerror="this.src=''; this.alt='ESP32-CAM 연결 대기 중...'">
                </div>
            </div>

            <!-- 2. AI 적재물 & 텔레메트리 -->
            <div class="card">
                <div class="title" id="lbl_ai_title">📦 AI 적재물 검수 (FOMO)</div>
                <div class="ai-chips">
                    <div class="chip chip-red" id="lbl_red">RED LED : 0 개</div>
                    <div class="chip chip-green" id="lbl_green">GREEN LED : 0 개</div>
                    <div class="chip chip-yellow" id="lbl_yellow">YELLOW LED : 0 개</div>
                </div>

                <div class="title" id="lbl_sensor_title">⚡ 차량 텔레메트리 및 센서 상태</div>
                <div class="status-row">
                    <div class="status-badge" id="lbl_status">상태 : NORMAL (정상 주행)</div>
                </div>

                <!-- DB 로그 팝업 버튼 -->
                <button class="btn-db-log" id="btn_db_log" onclick="openDbModal()">📊 DB 로그 기록 뷰어 열기</button>

                <div class="telemetry-grid">
                    <div class="metric-box" id="lbl_yaw">• 회전값(Yaw) : 0.0 °</div>
                    <div class="metric-box" id="lbl_speed">• 속도 : 0.0 m/s</div>
                    <div class="metric-box" id="lbl_tilt">• 앞뒤 기울기 : 0.0 °</div>
                    <div class="metric-box" id="lbl_tilt_side">• 옆기울기 : 0.0 °</div>
                    <div class="metric-box" id="lbl_dist">• 초음파 거리 : 0 cm</div>
                    <div class="metric-box" id="lbl_g">• 가속도(G) : 1.00 G</div>
                </div>
            </div>
        </div>

        <!-- ================= 우측 컬럼 ================= -->
        <div class="col">
            <!-- 1. 3D 카트 자세 뷰어 -->
            <div class="card">
                <div class="title" id="lbl_3d_title">🚗 실시간 3D 카트 자세 모니터링</div>
                <div class="viewport-box" id="container3d"></div>
            </div>

            <!-- 2. 2D IMU 추이 그래프 -->
            <div class="card">
                <div class="title" id="lbl_graph_title">📈 실시간 자세 추이 (Pitch / Roll)</div>
                <div class="chart-box">
                    <canvas id="imuChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= DB 로그 뷰어 모달 ================= -->
    <div class="modal-overlay" id="dbModal" onclick="closeDbModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="title" style="margin: 0; font-size: 15px;">🗄️ 데이터베이스 로그 뷰어 (CartDB Viewer)</span>
                <button class="modal-close" onclick="closeDbModal()">✕</button>
            </div>
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('alerts')">🚨 주행 이상 알림 (Alerts)</button>
                <button class="tab-btn" onclick="switchTab('orders')">📦 배송 주문 목록 (Orders)</button>
                <button class="tab-btn" onclick="switchTab('order_logs')">📝 실시간 변화 로그 (Order Logs)</button>
            </div>
            <div class="tab-content" id="tabContent">
                <table class="db-table" id="dbTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ================== 1. Three.js 3D 카트 렌더러 ==================
        const container3d = document.getElementById('container3d');
        const width = container3d.clientWidth || 500;
        const height = container3d.clientHeight || 360;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x181926);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(11.3, 6.7, 11.3);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.domElement.id = "canvas3d";
        container3d.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.minDistance = 5;
        controls.maxDistance = 30;

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 바닥 그리드
        const grid = new THREE.GridHelper(18, 18, 0x494d64, 0x24273a);
        grid.position.y = -1.2;
        scene.add(grid);

        // 카트 그룹
        const cartGroup = new THREE.Group();

        // 본체
        const bodyGeo = new THREE.BoxGeometry(4.0, 1.2, 2.4);
        const bodyMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(0.23, 0.51, 0.96),
            roughness: 0.4,
            metalness: 0.2,
            transparent: true,
            opacity: 0.9
        });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        const bodyEdges = new THREE.LineSegments(
            new THREE.EdgesGeometry(bodyGeo),
            new THREE.LineBasicMaterial({ color: 0xb3ccff })
        );
        bodyMesh.add(bodyEdges);
        cartGroup.add(bodyMesh);

        // 헤드포인트
        const headGeo = new THREE.BoxGeometry(0.5, 0.4, 1.2);
        const headMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(0.65, 0.85, 0.58),
            roughness: 0.3
        });
        const headMesh = new THREE.Mesh(headGeo, headMat);
        headMesh.position.set(1.75, 0.8, 0);
        const headEdges = new THREE.LineSegments(
            new THREE.EdgesGeometry(headGeo),
            new THREE.LineBasicMaterial({ color: 0xffffff })
        );
        headMesh.add(headEdges);
        cartGroup.add(headMesh);

        // 바퀴
        const wheelGeo = new THREE.BoxGeometry(0.8, 0.4, 0.3);
        const wheelMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(0.1, 0.1, 0.15) });
        const wheelOffsets = [
            [ 1.3, -0.7,  1.3],
            [ 1.3, -0.7, -1.3],
            [-1.3, -0.7,  1.3],
            [-1.3, -0.7, -1.3]
        ];
        wheelOffsets.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.position.set(...pos);
            const wEdges = new THREE.LineSegments(
                new THREE.EdgesGeometry(wheelGeo),
                new THREE.LineBasicMaterial({ color: 0x666680 })
            );
            wheel.add(wEdges);
            cartGroup.add(wheel);
        });

        scene.add(cartGroup);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            if (!container3d) return;
            const w = container3d.clientWidth;
            const h = container3d.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ================== 2. 2D Chart.js ==================
        const ctx = document.getElementById('imuChart').getContext('2d');
        const maxPoints = 100;
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(maxPoints).fill(''),
                datasets: [
                    { label: 'Pitch (앞뒤)', data: Array(maxPoints).fill(0), borderColor: '#a6da95', borderWidth: 2, tension: 0.1, pointRadius: 0 },
                    { label: 'Roll (좌우)', data: Array(maxPoints).fill(0), borderColor: '#8aadf4', borderWidth: 2, tension: 0.1, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: { min: -30, max: 30, grid: { color: '#24273a' }, ticks: { color: '#a5adcb' } },
                    x: { grid: { color: '#24273a' }, ticks: { display: false } }
                },
                plugins: { legend: { labels: { color: '#cad3f5' } } }
            }
        });

        // ================== 3. WebSocket 실시간 연동 ==================
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${location.host}/ws/telemetry`;
        const ws = new WebSocket(wsUrl);

        ws.onmessage = (event) => {
            try {
                const d = JSON.parse(event.data);

                document.getElementById('lbl_yaw').innerText = `• 회전값(Yaw) : ${d.yaw.toFixed(1)} °`;
                document.getElementById('lbl_speed').innerText = `• 속도 : ${d.speed ? d.speed.toFixed(1) : '0.0'} m/s`;
                document.getElementById('lbl_tilt').innerText = `• 앞뒤 기울기 : ${d.pitch.toFixed(1)} °`;
                document.getElementById('lbl_tilt_side').innerText = `• 옆기울기 : ${d.roll.toFixed(1)} °`;
                document.getElementById('lbl_dist').innerText = `• 초음파 거리 : ${d.distance} cm`;
                document.getElementById('lbl_g').innerText = `• 가속도(G) : ${d.g_val.toFixed(2)} G`;

                if (d.led_counts) {
                    document.getElementById('lbl_red').innerText = `RED LED : ${d.led_counts.r1 || 0} 개`;
                    document.getElementById('lbl_green').innerText = `GREEN LED : ${d.led_counts.g1 || 0} 개`;
                    document.getElementById('lbl_yellow').innerText = `YELLOW LED : ${d.led_counts.y1 || 0} 개`;
                }

                const statusBadge = document.getElementById('lbl_status');
                if (d.status === "NORMAL") {
                    statusBadge.innerText = "상태 : NORMAL (정상 주행)";
                    statusBadge.className = "status-badge";
                } else {
                    statusBadge.innerText = `경고 : 🚨 ${d.status}`;
                    statusBadge.className = "status-badge status-alert";
                }

                const rad = Math.PI / 180;
                cartGroup.rotation.order = 'ZYX';
                cartGroup.rotation.y = -d.yaw * rad;
                cartGroup.rotation.z = d.pitch * rad;
                cartGroup.rotation.x = -d.roll * rad;

                chart.data.datasets[0].data.push(d.pitch);
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.push(d.roll);
                chart.data.datasets[1].data.shift();
                chart.update();
            } catch (e) {
                console.error("[WS] Parse error:", e);
            }
        };

        // ================== 4. DB 로그 뷰어 모달 제어 ==================
        let cachedDbData = { alerts: [], orders: [], order_logs: [] };
        let currentTab = 'alerts';

        function formatDate(dt) {
            if (!dt) return '-';
            return String(dt).replace('T', ' ');
        }

        async function openDbModal() {
            document.getElementById('dbModal').style.display = 'flex';
            document.getElementById('tableHead').innerHTML = '';
            document.getElementById('tableBody').innerHTML = `<tr><td style="text-align: center; color: #89b4fa; padding: 20px;">DB에서 데이터를 조회하는 중...</td></tr>`;

            try {
                const res = await fetch('/api/db/logs');
                const result = await res.json();
                if (result.status === 'success') {
                    cachedDbData = result.data || { alerts: [], orders: [], order_logs: [] };
                    renderTable(currentTab);
                } else {
                    document.getElementById('tableBody').innerHTML = `<tr><td style="text-align: center; color: #ed8796; padding: 20px;">${result.message || '데이터를 불러오지 못했습니다.'}</td></tr>`;
                }
            } catch (err) {
                console.error("DB Fetch Error:", err);
                document.getElementById('tableBody').innerHTML = `<tr><td style="text-align: center; color: #ed8796; padding: 20px;">서버 통신 실패</td></tr>`;
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', 
                    (tabName === 'alerts' && idx === 0) || 
                    (tabName === 'orders' && idx === 1) || 
                    (tabName === 'order_logs' && idx === 2)
                );
            });
            renderTable(tabName);
        }

        function renderTable(tabName) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            const data = (cachedDbData && cachedDbData[tabName]) ? cachedDbData[tabName] : [];

            if (!Array.isArray(data) || data.length === 0) {
                thead.innerHTML = '';
                tbody.innerHTML = `<tr><td style="text-align: center; color: #6c7086; padding: 20px;">기록된 데이터가 없습니다.</td></tr>`;
                return;
            }

            if (tabName === 'alerts') {
                thead.innerHTML = `
                    <tr>
                        <th>ID</th><th>경고 유형</th><th>Pitch(°)</th><th>Roll(°)</th><th>가속도(G)</th><th>거리(cm)</th><th>기록 일시</th>
                    </tr>
                `;
                tbody.innerHTML = data.map(r => `
                    <tr>
                        <td>${r.log_id}</td>
                        <td><span style="color:#ed8796; font-weight:bold;">${r.warning_type || 'ALERT'}</span></td>
                        <td>${r.pitch !== undefined && r.pitch !== null ? r.pitch : '-'}</td>
                        <td>${r.roll !== undefined && r.roll !== null ? r.roll : '-'}</td>
                        <td>${r.g_force !== undefined && r.g_force !== null ? r.g_force : '-'}</td>
                        <td>${r.ultrasonic_distance !== undefined && r.ultrasonic_distance !== null ? r.ultrasonic_distance : '-'}</td>
                        <td>${formatDate(r.created_at)}</td>
                    </tr>
                `).join('');
            } else if (tabName === 'orders') {
                thead.innerHTML = `
                    <tr>
                        <th>Order ID</th><th>시작 적재 (R/G/Y)</th><th>도착 적재 (R/G/Y)</th><th>상태</th><th>시작 일시</th><th>종료 일시</th>
                    </tr>
                `;
                tbody.innerHTML = data.map(r => {
                    const isCompleted = r.status === 'COMPLETED';
                    const isMissing = r.status === 'MISSING';
                    const statusColor = isCompleted ? '#a6da95' : (isMissing ? '#ed8796' : '#eed49f');
                    
                    return `
                        <tr>
                            <td>${r.order_id}</td>
                            <td>${r.start_red ?? 0} / ${r.start_green ?? 0} / ${r.start_yellow ?? 0}</td>
                            <td>${r.end_red !== null && r.end_red !== undefined ? r.end_red : '-'} / ${r.end_green !== null && r.end_green !== undefined ? r.end_green : '-'} / ${r.end_yellow !== null && r.end_yellow !== undefined ? r.end_yellow : '-'}</td>
                            <td><span style="color:${statusColor}; font-weight:bold;">${r.status}</span></td>
                            <td>${formatDate(r.start_time)}</td>
                            <td>${formatDate(r.end_time)}</td>
                        </tr>
                    `;
                }).join('');
            } else if (tabName === 'order_logs') {
                thead.innerHTML = `
                    <tr>
                        <th>Log ID</th><th>Order ID</th><th>적재 상태 (Red / Green / Yellow)</th><th>기록 일시</th>
                    </tr>
                `;
                tbody.innerHTML = data.map(r => `
                    <tr>
                        <td>${r.log_id}</td>
                        <td>${r.order_id}</td>
                        <td>${r.red_count ?? 0} / ${r.green_count ?? 0} / ${r.yellow_count ?? 0}</td>
                        <td>${formatDate(r.created_at)}</td>
                    </tr>
                `).join('');
            }
        }

        function closeDbModal(e) {
            document.getElementById('dbModal').style.display = 'none';
        }
    </script>
</body>
</html>
